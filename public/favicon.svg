<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Calendar body -->
  <rect x="2" y="5" width="28" height="25" fill="#B80000"/>
  <!-- Header band -->
  <rect x="2" y="5" width="28" height="8" fill="#8a0000"/>
  <!-- Binding tabs -->
  <rect x="8" y="2" width="4" height="7" rx="1" fill="#102040"/>
  <rect x="20" y="2" width="4" height="7" rx="1" fill="#102040"/>
  <!-- Date grid — row 1 -->
  <rect x="6"  y="17" width="4" height="3" fill="white"/>
  <rect x="14" y="17" width="4" height="3" fill="white"/>
  <rect x="22" y="17" width="4" height="3" fill="white"/>
  <!-- Date grid — row 2 -->
  <rect x="6"  y="23" width="4" height="3" fill="white"/>
  <rect x="14" y="23" width="4" height="3" fill="white"/>
  <rect x="22" y="23" width="4" height="3" fill="white"/>
</svg>
